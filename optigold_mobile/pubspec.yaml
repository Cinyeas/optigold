name: optigold_mobile
description: OptiGold — Gold Options Trading Decision Advisor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP & API
  dio: ^5.4.3

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Animations
  flutter_animate: ^4.5.0

  # Charts
  fl_chart: ^0.68.0

  # UI utilities
  shimmer: ^3.0.0

  # Formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
